<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creación Platos de Comida</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<!-- bootstrap links -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- mis css -->
<link rel="stylesheet" href="/css/createProductoAdmin.css">
</head>
<body>

	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<div class="form-container">
		<div class="form-box">
			<div class="row">
				<div class="col-md-8 mx-auto rounded border p-4 m-4">
					<h2 class="text-center mb-5">Nuevo Plato de Comida</h2>

					<form method="post" enctype="multipart/form-data"
						th:object="${productDto}">
						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Nombre del Plato</label>
							<div class="col-sm-8">
								<input th:field="${productDto.name}" class="form-control">
								<p th:if="${#fields.hasErrors('name')}"
									th:errors="${productDto.name}" class="text-danger"></p>
							</div>
						</div>
						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Marca</label>
							<div class="col-sm-8">
								<input class="form-control" th:field="${productDto.brand}">
								<p th:if="${#fields.hasErrors('brand')}"
									th:errorclass="text-danger" th:errors="${productDto.brand}"></p>
							</div>
						</div>

						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Categoría</label>
							<div class="col-sm-8">
								<select class="form-select" th:field="${productDto.category}">
									<option value="Entradas">Entradas</option>
									<option value="Pollos">Pollos</option>
									<option value="Arroces">Arroces</option>
									<option value="Carnes">Carnes</option>
									<option value="Cazuelas">Cazuelas</option>
									<option value="Pescados">Pescados</option>
								</select>
								<p th:if="${#fields.hasErrors('category')}"
									th:errorclass="text-danger" th:errors="${productDto.category}"></p>
							</div>
						</div>
						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Precio del
								Producto</label>
							<div class="col-sm-8">
								<input class="form-control" type="number" step="100" min="0"
									th:field="${productDto.price}">
								<p th:if="${#fields.hasErrors('price')}"
									th:errorclass="text-danger" th:errors="${productDto.price}"></p>
							</div>
						</div>

						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Descripción del
								Producto</label>
							<div class="col-sm-8">
								<textarea class="form-control"
									th:field="${productDto.description}"></textarea>
								<p th:if="${#fields.hasErrors('description')}"
									th:errorclass="text-danger"
									th:errors="${productDto.description}"></p>
							</div>
						</div>
						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Cantidad Inicial</label>
							<div class="col-sm-8">
								<input class="form-control" type="number" min="0"
									th:field="${productDto.quantity}">
								<p th:if="${#fields.hasErrors('quantity')}"
									th:errorclass="text-danger" th:errors="${productDto.quantity}"></p>
							</div>
						</div>

						<div class="row mb-3">
							<label class="col-sm-4 col-form-label">Imagen del Plato</label>
							<div class="col-sm-8">
								<input class="form-control" type="file" name="imagen">
								<p th:if="${#fields.hasErrors('imageFile')}"
									th:errorclass="text-danger" th:errors="${productDto.imageFile}"></p>
							</div>
						</div>
						<div class="row">
							<div class="offset-sm-4 col-sm-4 d-grid">
								<button type="submit" class="btn btn-primary">Guardar</button>
							</div>
							<div class="col-sm-4 d-grid">
								<a class="btn btn-danger" href="/admin_producto" role="button">Cancelar</a>
							</div>
						</div>
					</form>

				</div>
			</div>
		</div>
	</div>
</body>
</html>

-<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Pedidos</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">

<!-- bootstrap links -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- mis css -->
<link rel="stylesheet" href="/css/admin_pedido.css">
</head>
<body>

	<header
		class="bg-teal d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico" alt="Logo de Nancy"
				width="50" height="50" class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>

		<div th:if="${#authentication.principal != 'anonymousUser'}">
			<div class="dropdown">
				<button class="btn btn-success dropdown-toggle" type="button"
					id="userDropdown" data-bs-toggle="dropdown">
					<span th:text="${#authentication.principal.fullname}"></span>
				</button>
				<ul class="dropdown-menu dropdown-menu-end">
					<li th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}">
						<a class="dropdown-item" th:href="@{/admin}">Panel Admin</a>
					</li>
					<li th:if="${#authorization.expression('hasAuthority(''USER'')')}">
						<a class="dropdown-item" th:href="@{/user}">Mi Cuenta</a>
					</li>
					<li><hr class="dropdown-divider"></li>
					<li>
						<form th:action="@{/logout}" method="post">
							<button class="dropdown-item" type="submit">Cerrar
								sesión</button>
						</form>
					</li>
				</ul>
			</div>
		</div>

		<div th:unless="${#authentication.principal != 'anonymousUser'}">
			<a href="/registration" class="btn btn-success me-2">Crear Cuenta</a>
			<a href="/login" class="btn btn-dark">Inicio de sesión</a>
		</div>
	</header>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid justify-content-center">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link text-black" href="/">Inicio</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/producto">Productos</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/sobreNosotros">Sobre Nosotros</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/ubicacion">Ubicación</a></li>
			</ul>
		</div>
	</nav>

	<main class="container mt-4">
		<h3 class="text-center mb-4">Pedidos</h3>
		<table class="table table-bordered text-center align-middle">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Productos</th>
					<th>Total</th>
					<th>Usuario</th>
					<th>Fecha</th>
					<th>Dirección</th>
					<th>Estado</th>
					<th>Acción</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="order : ${orders}">
					<td th:text="${order.id}"></td>
					<td>
						<ul class="list-unstyled mb-0">
							<li th:each="item : ${order.orderItems}"
								th:text="${item.product.name + ' x ' + item.quantity}"></li>
						</ul>
					</td>
					<td th:text="${order.totalAmount}"></td>
					<td th:text="${order.user.fullname}"></td>
					<td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
					<td th:if="${order.shippingAddress != null}"><span
						th:text="'Calle: ' + ${order.shippingAddress.street} + ', Ciudad: ' + ${order.shippingAddress.city} + ', Estado: ' + ${order.shippingAddress.state} + ', País: ' + ${order.shippingAddress.country} + ', Código Postal: ' + ${order.shippingAddress.postalCode}"></span>
					</td>
					<td th:if="${order.shippingAddress == null}">Sin dirección</td>
					<td th:text="PAGADO"></td>
					<td style="white-space: nowrap"><a
						class="btn btn-danger btn-sm"
						th:href="@{'/admin_pedidos/eliminar/' + ${order.id}}"
						onclick="return confirm('¿Está seguro de eliminar la orden?')">
							Eliminar </a></td>
				</tr>
			</tbody>
		</table>
		<a href="/admin" class="btn btn-secondary mt-3">Regresar</a>
	</main>

	<footer>2025 © Restaurante Avenida Rivera</footer>
</body>
</html>

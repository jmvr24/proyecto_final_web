<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Restaurante Avenida Rivera Campestre</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- mis css -->
<link rel="stylesheet" href="/css/admin_producto.css">
</head>
<body>

	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid justify-content-center">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link text-black" href="/">Inicio</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/producto">Productos</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/sobreNosotros">Sobre Nosotros</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/ubicacion">Ubicación</a></li>
			</ul>
		</div>
	</nav>

	<h2>Listado de Platos del Restaurante</h2>

	<div class="container mb-3 text-end">
		<a class="btn btn-primary" th:href="@{/admin_producto/CreateProduct}">Crear
			Producto</a>
	</div>


	<div class="container mb-5">
		<table class="table table-bordered table-hover text-center">
			<thead>
				<tr>
					<th>ID</th>
					<th>Nombre</th>
					<th>Marca</th>
					<th>Categoría</th>
					<th>Precio</th>
					<th>Imagen</th>
					<th>Creado</th>
					<th>Cantidad</th>
					<th>Acción</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="product : ${products}">
					<td th:text="${product.id}"></td>
					<td th:text="${product.name}"></td>
					<td th:text="${product.brand}"></td>
					<td th:text="${product.category}"></td>
					<td th:text="${product.price} + '$'"></td>
					<td><img th:src="@{${product.imageFileName}}" alt="..."
						width="100"></td>
					<td th:text="${product.createdAt.toString().substring(0, 10)}"></td>
					<td th:text="${product.quantity}"></td>
					<td style="white-space: nowrap">
						<div class="d-flex flex-column gap-2">
							<div class="d-flex gap-2">
								<a class="btn btn-success btn-sm"
									th:href="@{/admin_producto/EditProduct(id=${product.id})}">Editar</a>
								<a class="btn btn-danger btn-sm"
									th:href="@{/admin_producto/ProductDelete(id=${product.id})}"
									onclick="return confirm('¿Estás seguro?')">Eliminar</a>
							</div>
							<div class="d-flex gap-2">
								<form th:action="@{/admin_producto/inventario/aumentar}"
									method="post">
									<input type="hidden" name="id" th:value="${product.id}">
									<div class="input-group-sm">
										<input type="number" name="cantidad" min="1" value="1"
											class="form-control" style="width: 60px;">
										<button type="submit" class="btn btn-primary btn-sm">+</button>
									</div>
								</form>
								<form th:action="@{/admin_producto/inventario/disminuir}"
									method="post">
									<input type="hidden" name="id" th:value="${product.id}">
									<div class="input-group-sm">
										<input type="number" name="cantidad" min="1"
											th:max="${product.quantity}" value="1" class="form-control"
											style="width: 60px;">
										<button type="submit" class="btn btn-warning btn-sm">-</button>
									</div>
								</form>
							</div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="mb-3">
			<a class="btn btn-warning" href="/admin">Regresar</a>
		</div>
	</div>

	<footer>2025 © Restaurante Avenida Rivera</footer>

</body>

</html>

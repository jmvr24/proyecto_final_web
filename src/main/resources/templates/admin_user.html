<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Usuarios Registrados</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">

<!-- bootstrap links -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- mis css -->
<link rel="stylesheet" href="/css/admin_user.css">

</head>
<body>
	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid justify-content-center">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link text-black" href="/">Inicio</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/producto">Productos</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/sobreNosotros">Sobre Nosotros</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/ubicacion">Ubicación</a></li>
			</ul>
		</div>
	</nav>

	<h2>Usuarios Registrados</h2>
	<div class="container mb-3 text-end">
		<a class="btn btn-primary" href="/create">Nuevo Usuario</a> <a
			class="btn btn-secondary" href="admin_user/reporte">Reporte</a>
	</div>


	<div class="container mb-5">
		<table class="table table-bordered table-hover text-center">
			<thead>
				<tr>
					<th>ID</th>
					<th>Correo Electrónico</th>
					<th>Nombre Completo</th>
					<th>Rol</th>
					<th>Acción</th>
				</tr>
			</thead>

			<tbody class="table-group-divider">
				<tr th:each="user : ${users}">
					<td th:text="${user.id}"></td>
					<!-- ID -->
					<td th:text="${user.email}"></td>
					<td th:text="${user.fullname}"></td>
					<td th:text="${user.role}"></td>
					<td style="white-space: nowrap"><a class="btn btn-info btn-sm"
						th:href="@{'/admin_user/perfil/' + ${user.id}}"> Ver </a> <a
						class="btn btn-danger btn-sm"
						th:href="@{'/admin_user/eliminar/' + ${user.id}}"
						onclick="return confirm('¿Está seguro de eliminar al usuario?')">
							Eliminar </a></td>
				</tr>
			</tbody>


		</table>
		<div class="mb-3">
			<a class="btn btn-warning" href="/admin">Regresar</a>
		</div>
	</div>

	<footer>2025 © Restaurante Avenida Rivera</footer>

</body>
</html>

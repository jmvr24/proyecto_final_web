<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Confirmación del Pago</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- mis css  y js-->
<link rel="stylesheet" href="/css/confirmacionPago.css">
<script th:src="@{/js/limpiarCarro.js}"></script>
</head>
<body>

	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<div class="container my-5">
		<div class="card">
			<div class="card-header bg-success text-white">
				<h2>¡Pedido Confirmado!</h2>
			</div>
			<div class="card-body">
				<div class="alert alert-success">
					<h4 class="alert-heading">
						Gracias por tu compra, <span th:text="${order.user.fullname}"></span>!
					</h4>
					<p>
						Tu pedido #<span th:text="${order.id}"></span> ha sido procesado
						exitosamente.
					</p>
					<hr>
				</div>

				<h4>Resumen del Pedido</h4>
				<div class="table-responsive">
					<table class="table">
						<thead>
							<tr>
								<th>Producto</th>
								<th>Cantidad</th>
								<th>Precio Unitario</th>
								<th>Subtotal</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${order.orderItems}">
								<td th:text="${item.product.name}"></td>
								<td th:text="${item.quantity}"></td>
								<td th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}"></td>
								<td
									th:text="${'$' + #numbers.formatDecimal(item.price * item.quantity + 5000, 1, 2)}"></td>
							</tr>
						</tbody>
						<tfoot>
							<tr>
								<th colspan="3" class="text-end">Total:</th>
								<th
									th:text="${'$' + #numbers.formatDecimal(order.totalAmount + 5000, 1, 2)}"></th>
							</tr>
						</tfoot>
					</table>
				</div>

				<h4 class="mt-4">Dirección de Envío</h4>
				<address>
					<strong th:text="${order.shippingAddress.street}"></strong><br>
					<span th:text="${order.shippingAddress.city}"></span>, <span
						th:text="${order.shippingAddress.state}"></span><br> <span
						th:text="${order.shippingAddress.country}"></span>, <span
						th:text="${order.shippingAddress.postalCode}"></span>
				</address>

				<div class="mt-4">
					<a href="/producto" class="btn btn-primary">Seguir Comprando</a>
				</div>
			</div>
		</div>
	</div>

	<footer>2025 © Restaurante Avenida Rivera</footer>
</body>
</html>

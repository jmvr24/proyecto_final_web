<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Nuevo Usuario</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<!-- bootstrap links -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- mis css -->
<link rel="stylesheet" href="/css/create.css">

</head>
<body>

	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<div class="form-container">
		<div class="form-box">
			<div class="row">
				<div class="col-md-8 mx-auto rounded border p-4 m-4">
					<h2 class="text-center mb-4">Nuevo Usuario</h2>
					<form th:object="${clientDto}" method="post">
						<div class="mb-3">
							<label for="email" class="form-label">Correo Electrónico</label>
							<input type="email" th:field="${clientDto.email}"
								class="form-control" id="email" required>
							<p th:if="${#fields.hasErrors('email')}"
								th:errorclass="text-danger" th:errors="${clientDto.email}"></p>
						</div>
						<div class="mb-3">
							<label for="fullname" class="form-label">Nombre Completo</label>
							<input type="text" th:field="${clientDto.fullname}"
								class="form-control" id="fullname" required>
							<p th:if="${#fields.hasErrors('fullname')}"
								th:errorclass="text-danger" th:errors="${clientDto.fullname}"></p>
						</div>
						<div class="mb-3">
							<label for="role" class="form-label">Rol</label> <select
								th:field="${clientDto.role}" class="form-select" id="role"
								required>
								<option value="">-- Seleccione un Rol--</option>
								<option value="USER">USER</option>
								<option value="ADMIN">ADMIN</option>
							</select>
						</div>
						<div class="d-flex justify-content-between">
							<button type="submit" class="btn btn-success">Guardar</button>
							<a href="/admin_user" class="btn btn-danger">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>

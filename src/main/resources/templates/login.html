<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

	<div class="header">
		<img src="/images/logo_avenida-rivera.ico"
			alt="Logo del Restaurante Avenida Rivera Campestre">
		<h3 class="mb-0">Restaurante Avenida Rivera Campestre</h3>
	</div>

	<div class="form-container">
		<div class="form-box">
			<h4 class="text-center mb-4">Inicie Sesión</h4>

			<!-- Mensajes de error/logout -->
			<div class="container">
				<div class="message alert alert-danger text-center"
					th:if="${param.error}">¡Usuario o Contraseña Inválidos!</div>
				<div class="message alert alert-info text-center"
					th:if="${param.logout}">¡Sesión Cerrrada Correctamente!</div>
			</div>

			<form th:action="@{/login}" method="POST">
				<div class="mb-3">
					<input type="email" class="form-control" id="username"
						name="username" placeholder="Correo Electrónico" required>
				</div>
				<div class="mb-4">
					<input type="password" class="form-control" id="password"
						name="password" placeholder="Contraseña" required>
				</div>
				<div class="d-grid mb-3">
					<button type="submit" class="btn btn-dark">Iniciar Sesión</button>
				</div>
			</form>

			<div class="d-grid mt-2">
				<a th:href="@{/}" class="btn btn-secondary btn-info"> Volver al
					Inicio </a>
			</div>


		</div>
	</div>
	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

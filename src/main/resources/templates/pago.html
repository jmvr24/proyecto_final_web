<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Sección de Pago</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<!-- bootstrap links -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- mis css y js -->
<link rel="stylesheet" href="/css/pago.css">
<script th:src="@{/js/pagoCarrito.js}" defer></script>
</head>
<body>

	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<div class="container my-5">
		<div class="row">
			<div class="col-md-8">
				<h2>Formulario de Pago</h2>
				<form th:action="@{/pago}" th:object="${paymentForm}" method="post"
					id="formulario-pago">
					<div class="card mb-4">
						<div class="card-header bg-light">
							<h5 class="mb-0">Información de Pago</h5>
						</div>
						<div class="card-body">
							<div class="mb-3">
								<label for="cardNumber" class="form-label">Número de
									Tarjeta <span class="text-danger">*</span>
								</label> <input type="text" th:field="*{cardNumber}"
									class="form-control" id="cardNumber"
									placeholder="1234 5678 9012 3456" maxlength="23" required
									autocomplete="cc-number" /> <small class="text-muted">13-19
									dígitos</small>
							</div>
							<div class="mb-3">
								<label for="cardName" class="form-label">Nombre en la
									Tarjeta <span class="text-danger">*</span>
								</label> <input type="text" th:field="*{cardName}" class="form-control"
									id="cardName" placeholder="Nombre completo" required
									autocomplete="cc-name" />
							</div>
							<div class="row mb-3">
								<div class="col-md-6">
									<label for="expiryDate" class="form-label">Fecha de
										Expiración <span class="text-danger">*</span>
									</label> <input type="text" th:field="*{expiryDate}"
										class="form-control" id="expiryDate" placeholder="MM/AA"
										maxlength="5" required autocomplete="cc-exp" /> <small
										class="text-muted">Formato: MM/AA</small>
								</div>
								<div class="col-md-6">
									<label for="cvv" class="form-label">CVV <span
										class="text-danger">*</span></label> <input type="text"
										th:field="*{cvv}" class="form-control" id="cvv"
										placeholder="123" maxlength="4" required autocomplete="cc-csc" />
									<small class="text-muted">3-4 dígitos</small>
								</div>
							</div>
						</div>
					</div>

					<div class="card">
						<div class="card-header bg-light">
							<h5 class="mb-0">Dirección de Envío</h5>
						</div>
						<div class="card-body">
							<div class="mb-3">
								<label for="address" class="form-label">Dirección <span
									class="text-danger">*</span></label> <input type="text"
									th:field="*{address}" class="form-control" id="address"
									placeholder="Calle, número, apartamento, etc." required />
							</div>
							<div class="row mb-3">
								<div class="col-md-6">
									<label for="city" class="form-label">Ciudad <span
										class="text-danger">*</span></label> <input type="text"
										th:field="*{city}" class="form-control" id="city" required />
								</div>
								<div class="col-md-6">
									<label for="state" class="form-label">Estado/Departamento
										<span class="text-danger">*</span>
									</label> <input type="text" th:field="*{state}" class="form-control"
										id="state" required />
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-md-6">
									<label for="country" class="form-label">País <span
										class="text-danger">*</span></label> <input type="text"
										th:field="*{country}" class="form-control" id="country"
										required />
								</div>
								<div class="col-md-6">
									<label for="postalCode" class="form-label">Código
										Postal <span class="text-danger">*</span>
									</label> <input type="text" th:field="*{postalCode}"
										class="form-control" id="postalCode" placeholder="12345"
										maxlength="6" required /> <small class="text-muted">5-6
										dígitos</small>
								</div>
							</div>
							<div class="mb-3 form-check">
								<input type="checkbox" th:field="*{saveInfo}"
									class="form-check-input" id="saveInfo" /> <label
									class="form-check-label" for="saveInfo"> Guardar esta
									información para la próxima vez </label>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div class="col-md-4">
				<div class="summary-card">
					<h4>Resumen del Pedido</h4>
					<div id="lista-productos" class="list-group mb-3"></div>
					<hr>
					<div class="d-flex justify-content-between mb-2">
						<span>Subtotal:</span> <span id="subtotal-pagar">$0.00</span>
					</div>
					<div class="d-flex justify-content-between mb-3">
						<span>Envío:</span> <span>$5000</span>
					</div>
					<div class="d-flex justify-content-between fw-bold fs-5">
						<span>Total:</span> <span id="total-pagar">$5000</span>
					</div>
					<button type="submit" form="formulario-pago"
						class="btn btn-primary w-100 mt-3">
						<i class="fas fa-credit-card"></i> Confirmar Pago
					</button>
				</div>
			</div>
		</div>
	</div>
	<footer class="bg-dark text-white text-center py-3 mt-5"> 2025
		© Restaurante Avenida Rivera </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">

<!-- links Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- mis css -->
<link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
	<div class="header">
		<img src="/images/logo_avenida-rivera.ico"
			alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
			class="me-3">
		<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
	</div>

	<div class="form-container">
		<div class="form-box">
			<h4 class="text-center mb-4">Registrese</h4>

			<!-- Formulario de registro -->
			<form th:action="@{/registration}" method="POST" th:object="${user}">
				<div class="mb-3">
					<input th:field="*{fullname}" type="text" class="form-control"
						id="fullname" placeholder="Ingrese su nombre completo" required>
				</div>

				<div class="mb-3">
					<input th:field="*{email}" type="email" class="form-control"
						id="email" placeholder="Ingrese un correo electrónico" required>
				</div>

				<div class="mb-4">
					<input th:field="*{password}" type="password" class="form-control"
						id="password" placeholder="Ingrese una contraseña" required>
				</div>

				<div class="d-grid">
					<button type="submit" class="btn btn-info">Crear Cuenta
					</button>
				</div>
			</form>
			<div class="d-grid mt-2">
				<a th:href="@{/}" class="btn btn-secondary btn-secondary"> Volver al
					Inicio </a>
			</div>
		</div>
	</div>

</body>
</html>

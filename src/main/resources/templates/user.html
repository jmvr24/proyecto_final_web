<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Cuenta</title>
<link rel="icon" href="/images/logo_avenida-rivera.ico">
<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
	rel="stylesheet">

<!-- mis css-->
<link rel="stylesheet" th:href="@{/css/user.css}">
</head>

<body>
	<header
		class="bg-dark d-flex justify-content-between align-items-center px-4 py-2">
		<div class="d-flex align-items-center">
			<img src="/images/logo_avenida-rivera.ico"
				alt="Logo del Restaurante Avenida Rivera" width="50" height="50"
				class="me-3">
			<h1 class="text-white fs-4">Restaurante Avenida Rivera</h1>
		</div>
	</header>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid justify-content-center">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link text-black" href="/">Inicio</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/producto">Productos</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/sobreNosotros">Sobre Nosotros</a></li>
				<li class="nav-item"><a class="nav-link text-black"
					href="/ubicacion">Ubicación</a></li>
			</ul>
		</div>
	</nav>

	<div class="container-fluid main-content">
		<div class="row h-100">

			<div
				class="col-md-4 p-4 d-flex justify-content-center align-items-start">
				<div class="card profile-card w-100 p-4">
					<p class="mb-4">
						Bienvenido(a) <span th:text="${user.fullname}"></span>
					</p>
					<p class="mb-4">
						Correo electrónico: <span th:text="${user.email}"></span>
					</p>
				</div>
			</div>
		</div>
	</div>

	<footer>2025 © Restaurante Avenida Rivera</footer>

</body>
</html>
